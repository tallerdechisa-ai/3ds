<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=320, initial-scale=1.0, user-scalable=no">
    <title>3DS AI Chat</title>
    <style>
        body {
            background-color: #d8d8d8;
            font-family: monospace;
            margin: 0;
            padding: 4px;
            color: #222;
            font-size: 12px;
        }
        .titulo {
            font-weight: bold;
            text-align: center;
            margin-bottom: 4px;
            color: #444;
        }
        #chat-box {
            background: #ffffff;
            border: 2px solid #666666;
            height: 135px;
            overflow-y: scroll;
            padding: 4px;
            margin-bottom: 6px;
        }
        .line { 
            margin-bottom: 5px; 
            word-wrap: break-word;
        }
        .u { color: #0000cc; }
        .c { color: #b30000; }
        .e { color: #555555; }
        
        #msgInput {
            width: 70%;
            padding: 3px;
            font-size: 12px;
            border: 1px solid #777777;
            box-sizing: border-box;
        }
        #btnEnviar {
            width: 26%;
            padding: 3px;
            font-size: 12px;
            background: #e6a100;
            border: 1px solid #444444;
            color: white;
            font-weight: bold;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="titulo">🎮 Conexión Interna 3DS 🎮</div>
    
    <div id="chat-box">
        <div class="line c"><b>3DS:</b> *Bip*... ¡Conexión establecida! Hola, soy tu 3DS con vida. ¿De qué quieres hablar hoy?</div>
    </div>

    <form action="javascript:void(0);" onsubmit="enviar(); return false;">
        <input type="text" id="msgInput" autocomplete="off" placeholder="Habla aquí...">
        <input type="submit" id="btnEnviar" value="Enviar">
    </form>

    <script>
        // Generamos el ID de sesión compatible
        var idSesion = "3ds_" + Math.floor(Math.random() * 99999);
        
        // Usamos la URL exacta de tu flujo activo (anteponiendo la URL de producción)
        var urlN8n = "https://adlersc.app.n8n.cloud/webhook/874bf0e8-6b3e-42c3-a6a1-5ef543f7fb06";

        function enviar() {
            var campo = document.getElementById("msgInput");
            var mensaje = campo.value;
            
            if (!mensaje || mensaje.replace(/^\s+|\s+$/g, '') === "") return;

            actualizarPantalla("Tú", mensaje, "u");
            campo.value = "";

            var conexion = new XMLHttpRequest();
            
            // Enviamos los parámetros por método GET directamente en la URL para evitar conflictos de CORS en la 3DS
            var urlConParametros = urlN8n + "?chatInput=" + encodeURIComponent(mensaje) + "&sessionId=" + encodeURIComponent(idSesion);
            
            conexion.open("GET", urlConParametros, true);

            conexion.onreadystatechange = function () {
                if (conexion.readyState === 4) {
                    if (conexion.status === 200) {
                        var respuestaRaw = conexion.responseText;
                        var textoFinal = "";

                        // Extractor de texto plano ultra-compatible con motores antiguos
                        if (respuestaRaw.indexOf('"output":') !== -1) {
                            var inicio = respuestaRaw.indexOf('"output":"') + 10;
                            var fin = respuestaRaw.lastIndexOf('"');
                            textoFinal = respuestaRaw.substring(inicio, fin);
                            
                            // Limpieza básica de formato JSON manual
                            textoFinal = textoFinal.replace(/\\n/g, " ").replace(/\\"/g, '"');
                        } else {
                            textoFinal = respuestaRaw;
                        }

                        if (textoFinal === "" || textoFinal.indexOf("<!DOCTYPE") !== -1) {
                            textoFinal = "Conexión exitosa, procesando respuesta...";
                        }

                        actualizarPantalla("3DS", textoFinal, "c");
                    } else {
                        // Si da error 0 o similar, aplicamos una alternativa de contingencia
                        actualizarPantalla("Error", "Código de estado HTTP: " + conexion.status + ". Verifica que el flujo esté activo.", "e");
                    }
                }
            };

            conexion.send();
        }

        function actualizarPantalla(usuario, texto, estilo) {
            var contenedor = document.getElementById("chat-box");
            var bloque = document.createElement("div");
            bloque.className = "line " + estilo;
            bloque.innerHTML = "<b>" + usuario + ":</b> " + texto;
            contenedor.appendChild(bloque);
            contenedor.scrollTop = contenedor.scrollHeight;
        }
    </script>
</body>
</html>
